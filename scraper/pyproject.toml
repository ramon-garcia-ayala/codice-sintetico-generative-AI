[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codice-scraper"
version = "0.1.0"
description = "Dataset geológico para el LoRA de Códice Sintético: auditoría, rescate de procedencia y scraping multi-fuente"
requires-python = ">=3.11"

# Deliberadamente mínimo: pHash y varianza del Laplaciano están implementados
# en numpy puro (ver hashing.py) para no depender de imagehash ni de OpenCV.
dependencies = [
    "pillow>=10",
    "numpy>=1.24",
    "requests>=2.31",
    "pydantic>=2.5",
    "pyyaml>=6",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]
# Sólo hace falta para `codice-scraper synthesize`. El resto del paquete no
# los importa, así que quedan fuera de las dependencias base.
#
# `tokenizers<0.23` es explícito porque `diffusers`/`transformers` no lo fijan
# ellos mismos: instalar sin este techo trae `0.23.0rc0` (release candidate),
# que rompe el tokenizer CLIP de SDXL con
# `RobertaProcessing.__new__() got an unexpected keyword argument 'cls'`.
# Se reprodujo en vivo instalando este extra sobre un `transformers` ya
# presente en el entorno.
synth = [
    "torch>=2.4",
    "diffusers>=0.30",
    "accelerate>=0.30",
    "tokenizers<0.23",
]

[project.scripts]
codice-scraper = "codice_scraper.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
